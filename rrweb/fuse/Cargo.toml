[package]
name = "rrweb-fuse"
version = "0.2.0"
edition = "2024"
publish = false
description = "rapidraw-web: folder s klijentskog računala kao disk na serveru (Linux: FUSE, Windows: WinFsp); operacije rješava relay"
license = "AGPL-3.0-only"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }   # bez libfuse: mount preko fusermount3

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", default-features = false }  # WinFsp DLL se učitava iz instalacije (src/windows.rs)
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_LibraryLoader", "Win32_System_Registry",
] }

[profile.release]
lto = true
strip = true
