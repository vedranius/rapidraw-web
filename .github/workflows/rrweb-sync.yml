# Release tagovi: rapidraw-v<RapidRAW>-web-v<web>, npr. rapidraw-v1.6.6-web-v1.15.0 (tag pokreće rrweb-release.yml).
#  - push na main koji mijenja rrweb/VERSION  → nova web verzija, tag na tom commitu
#  - svaki dan (i ručno)                     → merge upstream main → main; ako RapidRAW ima novi release,
#                                              tag na spojenom main commitu s trenutnom web verzijom
# Tag pokazuje na stvarni main commit (RapidRAW + rrweb sloj + AI sloj), ne na sintetički web-only commit.
# U poruci taga je izvorni commit (main@<sha>), iz njega rrweb/release-notes.mjs radi popis promjena.
# Treba secret RRWEB_PAT (fine-grained PAT: ovaj repo, Contents + Workflows: read/write),
# jer GITHUB_TOKEN ne smije pushati commitove s workflow datotekama niti pokretati druge workflowe.
name: rapidraw-web upstream sync

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['rrweb/VERSION']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Ručno: RapidRAW tag (npr. v1.6.6). Prazno = verzija iz src-tauri/tauri.conf.json.'
        required: false

permissions:
  contents: read
  issues: write

concurrency: rrweb-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RRWEB_PAT }}

      - name: Git setup
        run: |
          git config user.name  "rapidraw-web bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CyberTimon/RapidRAW.git
          git fetch upstream --tags --force --quiet

      - name: Merge upstream main
        if: github.event_name != 'push'
        run: |
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
          else
            git merge --abort
            gh issue create -R "$GITHUB_REPOSITORY" -t "Upstream merge konflikt" \
              -b "upstream/main se ne može automatski spojiti u main. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
        env: { GH_TOKEN: '${{ github.token }}' }

      - name: Plan release
        id: plan
        run: |
          # The tag names the RapidRAW version actually present in this commit.
          UP="${{ github.event.inputs.upstream_tag }}"
          [ -n "$UP" ] || UP="v$(jq -r .version src-tauri/tauri.conf.json)"
          # Latest published web version; a new VERSION must be higher.
          LATEST=$(git tag -l 'rapidraw-v*-web-v*' | sed 's/.*-web-v//' | sort -V | tail -1)
          if [ "${{ github.event_name }}" = push ] || [ -z "$LATEST" ]; then
            WEB=$(tr -d '[:space:]' < rrweb/VERSION)
            if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$WEB" | sort -V | tail -1)" != "$WEB" -o "$LATEST" = "$WEB" ]; then
              echo "::error::rrweb/VERSION ($WEB) mora biti veći od zadnje objavljene web verzije ($LATEST)"
              exit 1
            fi
          else
            WEB="$LATEST"
          fi
          SRC=$(git rev-parse HEAD)
          TAG="rapidraw-$UP-web-v$WEB"
          echo "up=$UP" "web=$WEB" "src=$SRC" "tag=$TAG" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$TAG već postoji"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Novi release: $TAG (source $SRC)"
          fi
        env: { GH_TOKEN: '${{ github.token }}' }

      - name: Create release tag
        if: steps.plan.outputs.new == 'true'
        run: |
          UP="${{ steps.plan.outputs.up }}"; WEB="${{ steps.plan.outputs.web }}"
          SRC="${{ steps.plan.outputs.src }}"; TAG="${{ steps.plan.outputs.tag }}"
          git tag -a "$TAG" -m "RapidRAW $UP + rapidraw-web v$WEB (source from main@$(git rev-parse "$SRC^{commit}"))" "$SRC"
          git push origin "refs/tags/$TAG"
