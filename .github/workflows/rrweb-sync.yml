# Release tagovi: rapidraw-v<RapidRAW>-web-v<web>, npr. rapidraw-v1.6.4-web-v1.1.0 (tag pokreće rrweb-release.yml).
#  - push na main koji mijenja rrweb/VERSION  → nova web verzija, sloj s tog commita, na zadnjem RapidRAW releaseu
#  - svaki dan (i ručno)                     → merge upstream main → main; ako RapidRAW ima novi release,
#                                              tag sa zadnjom OBJAVLJENOM web verzijom (neobjavljene izmjene s main-a ne idu van)
# Tag = točno upstream release + jedan commit sa slojem (rrweb/, .github/README.md, rrweb workflowi);
# u poruci taga je izvorni commit sloja (main@<sha>), iz njega rrweb/release-notes.mjs radi popis promjena.
# Treba secret RRWEB_PAT (fine-grained PAT: ovaj repo, Contents + Workflows: read/write),
# jer GITHUB_TOKEN ne smije pushati commitove s workflow datotekama niti pokretati druge workflowe.
name: rapidraw-web upstream sync

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['rrweb/VERSION']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Ručno: upstream RapidRAW tag (npr. v1.6.4). Prazno = zadnji release.'
        required: false

permissions:
  contents: read
  issues: write

concurrency: rrweb-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RRWEB_PAT }}

      - name: Git setup
        run: |
          git config user.name  "rapidraw-web bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CyberTimon/RapidRAW.git
          git fetch upstream --tags --force --quiet

      - name: Merge upstream main
        if: github.event_name != 'push'
        run: |
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
          else
            git merge --abort
            gh issue create -R "$GITHUB_REPOSITORY" -t "Upstream merge konflikt" \
              -b "upstream/main se ne može automatski spojiti u main. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
        env: { GH_TOKEN: '${{ github.token }}' }

      - name: Plan release
        id: plan
        run: |
          UP="${{ github.event.inputs.upstream_tag }}"
          [ -n "$UP" ] || UP=$(gh api repos/CyberTimon/RapidRAW/releases/latest --jq .tag_name)
          # zadnja objavljena web verzija i commit s kojeg je njen sloj
          LATEST=$(git tag -l 'rapidraw-v*-web-v*' | sed 's/.*-web-v//' | sort -V | tail -1)
          if [ "${{ github.event_name }}" = push ] || [ -z "$LATEST" ]; then
            WEB=$(tr -d '[:space:]' < rrweb/VERSION)
            SRC=$(git rev-parse HEAD)
            if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$WEB" | sort -V | tail -1)" != "$WEB" -o "$LATEST" = "$WEB" ]; then
              echo "::error::rrweb/VERSION ($WEB) mora biti veći od zadnje objavljene web verzije ($LATEST)"
              exit 1
            fi
          else
            WEB="$LATEST"
            SRC=$(git tag -l "rapidraw-v*-web-v$WEB" --format='%(contents)' | sed -n 's/.*main@\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)
            [ -n "$SRC" ] || SRC=$(git tag -l "rapidraw-v*-web-v$WEB" | head -1)
          fi
          TAG="rapidraw-$UP-web-v$WEB"
          echo "up=$UP" "web=$WEB" "src=$SRC" "tag=$TAG" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$TAG već postoji"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Novi release: $TAG (sloj s $SRC)"
          fi
        env: { GH_TOKEN: '${{ github.token }}' }

      - name: Create release tag
        if: steps.plan.outputs.new == 'true'
        run: |
          UP="${{ steps.plan.outputs.up }}"; WEB="${{ steps.plan.outputs.web }}"
          SRC="${{ steps.plan.outputs.src }}"; TAG="${{ steps.plan.outputs.tag }}"
          git checkout --quiet --detach "refs/tags/$UP"
          git checkout "$SRC" -- rrweb .github/README.md \
            .github/workflows/rrweb-release.yml .github/workflows/rrweb-sync.yml
          git commit --quiet -m "rapidraw-web v$WEB on RapidRAW $UP"
          git tag -a "$TAG" -m "RapidRAW $UP + rapidraw-web v$WEB (rrweb layer from main@$(git rev-parse "$SRC^{commit}"))"
          git push origin "refs/tags/$TAG"
