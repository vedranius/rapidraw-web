# rapidraw-web release. Tag = RapidRAW verzija + "-web" (npr. v1.6.4-web).
# Tag obično kreira rrweb-sync.yml automatski kad izađe novi RapidRAW release.
name: rapidraw-web release

on:
  push:
    tags: ['v*-web']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Postojeći tag, npr. v1.6.4-web'
        required: true

permissions:
  contents: write
  issues: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  server:
    name: Server bundle (web UI + relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: node rrweb/check-shims.mjs
      - run: npm ci --no-audit --no-fund
      - run: npx vite build --config rrweb/vite.web.config.mjs
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: rrweb/relay
      - name: Package
        run: |
          UP="${TAG%-web}"; UP="${UP#v}"; D="rapidraw-web-server-$UP"
          mkdir -p "out/$D"
          cp -r rrweb/dist-web rrweb/relay rrweb/run.sh rrweb/run.ps1 rrweb/README.md LICENSE "out/$D/"
          tar -C out -czf "$D.tar.gz" "$D"
          (cd out && zip -qr "../$D.zip" "$D")
      - uses: actions/upload-artifact@v4
        with: { name: server, path: 'rapidraw-web-server-*' }

  bridge-linux:
    name: Bridge Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true   # kao upstream build.yml: linuxdeploy-ov strip ne zna nove ELF sekcije
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rrweb-${{ matrix.runner }}
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config xdg-utils
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --bundles deb,rpm,appimage --config rrweb/tauri.bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  bridge-windows:
    name: Bridge Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: rrweb-windows }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --bundles nsis --config rrweb/tauri.bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [server, bridge-linux, bridge-windows]
    if: ${{ !cancelled() && needs.server.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes
        run: |
          UP="${TAG%-web}"
          sed "s|{{UPSTREAM_TAG}}|$UP|g" rrweb/RELEASE_NOTES.md > notes.md
          missing=""
          [ "${{ needs.bridge-linux.result }}" = success ] || missing="$missing Linux"
          [ "${{ needs.bridge-windows.result }}" = success ] || missing="$missing Windows"
          [ -n "$missing" ] && printf '\n> ⚠️ Bridge build failed for:%s — not included in this release.\n' "$missing" >> notes.md
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RapidRAW ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
          make_latest: true

  report-failure:
    needs: [server, bridge-linux, bridge-windows, release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            -t "Release $TAG: build nije uspio" \
            -b "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env: { GH_TOKEN: '${{ github.token }}' }
